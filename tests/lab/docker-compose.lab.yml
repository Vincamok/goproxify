  lab-k6:
    image: grafana/k6:latest
    container_name: lab-k6
    user: root
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /scripts /results
        for f in common smoke moderate saturation baseline spike stress soak mixed realistic hosts; do eval "printf %s \"\$$K_$$f\"" > /scripts/$$f.js; done
        mv /scripts/hosts.js /hosts.sh
        exec sleep infinity
    networks: [goproxify_net]
    environment:
      K_common: |
        import http from "k6/http";
        import { check } from "k6";

        export const HOST = __ENV.HOST || "lab-fast.lab.test";
        export const BASE = `http://$${HOST}`;

        export function get(path, tags) {
          const res = http.get(`$${BASE}$${path}`, { tags });
          check(res, { "status 2xx": (r) => r.status >= 200 && r.status < 300 });
          return res;
        }

        export function summary(name) {
          return (data) => ({
            [`/results/$${name}.json`]: JSON.stringify(data, null, 2),
            stdout: textSummary(data),
          });
        }

        function textSummary(d) {
          const m = d.metrics;
          const p = (k, q) => (m[k] && m[k].values[q] !== undefined ? m[k].values[q].toFixed(1) : "-");
          return [
            "",
            `requêtes   : $${m.http_reqs.values.count} ($${m.http_reqs.values.rate.toFixed(0)}/s)`,
            `échecs     : $${(m.http_req_failed.values.rate * 100).toFixed(2)} %`,
            `latence ms : p50=$${p("http_req_duration", "med")} p95=$${p("http_req_duration", "p(95)")} p99=$${p("http_req_duration", "p(99)")} max=$${p("http_req_duration", "max")}`,
            "",
          ].join("\n");
        }
      K_smoke: |
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          vus: 2,
          duration: "15s",
          thresholds: { http_req_failed: ["rate<0.01"], http_req_duration: ["p(95)<200"] },
        };

        export default function () {
          get("/");
          get("/echo");
        }

        export const handleSummary = summary("smoke");
      K_moderate: |
        // Charge modérée à DÉBIT IMPOSÉ (modèle ouvert) : RATE req/s (défaut 300) pendant DURATION (défaut 1m).
        // Le débit est fixé sous le plafond du système : la latence mesurée est celle du service, pas d'une file d'attente.
        // dropped_iterations > 0 signifie que le système n'a pas tenu le débit demandé.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            moderate: {
              executor: "constant-arrival-rate",
              rate: Number(__ENV.RATE || 300),
              timeUnit: "1s",
              duration: __ENV.DURATION || "1m",
              preAllocatedVUs: 100,
              maxVUs: 400,
            },
          },
          thresholds: {
            http_req_failed: ["rate<0.01"],
            http_req_duration: ["p(95)<100", "p(99)<300"],
            dropped_iterations: ["count==0"],
          },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.8) get("/");
          else if (r < 0.9) get("/echo");
          else get("/bytes?n=65536");
        }

        export const handleSummary = summary("moderate");
      K_saturation: |
        // Saturation : 50 VUs sans pause pendant ~1 min (modèle fermé). Mesure le DÉBIT ATTEINT par le système
        // (k6 + Passerelle + backend sur la même machine). Les latences reflètent alors la file d'attente
        // (loi de Little : latence moyenne ≈ VUs / débit) : aucun seuil de latence, erreurs seulement.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "10s", target: 50 },
            { duration: "40s", target: 50 },
            { duration: "10s", target: 0 },
          ],
          thresholds: { http_req_failed: ["rate<0.01"] },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.8) get("/");
          else if (r < 0.9) get("/echo");
          else get("/bytes?n=65536");
        }

        export const handleSummary = summary("saturation");
      K_baseline: |
        // Montée en charge progressive (équivalent docs/benchmark.md), sans latence backend.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "30s", target: 100 },
            { duration: "60s", target: 500 },
            { duration: "30s", target: 0 },
          ],
          thresholds: { http_req_failed: ["rate<0.01"], http_req_duration: ["p(95)<100", "p(99)<300"] },
        };

        export default function () {
          get("/");
        }

        export const handleSummary = summary("baseline");
      K_spike: |
        // Pic brutal : 20 -> 1000 VUs en 10 s, palier, retour. Vérifie l'absence d'effondrement et la reprise.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "20s", target: 20 },
            { duration: "10s", target: 1000 },
            { duration: "60s", target: 1000 },
            { duration: "10s", target: 20 },
            { duration: "40s", target: 20 },
          ],
          thresholds: { http_req_failed: ["rate<0.02"] },
        };

        export default function () {
          get("/slow?ms=20");
        }

        export const handleSummary = summary("spike");
      K_stress: |
        // Recherche du point de rupture : débit imposé (open model) croissant jusqu'à saturation.
        // Le run s'arrête dès que >10 % d'erreurs (abortOnFail) : le dernier palier sain = capacité.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            breakpoint: {
              executor: "ramping-arrival-rate",
              startRate: 200,
              timeUnit: "1s",
              preAllocatedVUs: 500,
              maxVUs: 5000,
              stages: [
                { duration: "1m", target: 2000 },
                { duration: "1m", target: 5000 },
                { duration: "1m", target: 10000 },
                { duration: "1m", target: 20000 },
              ],
            },
          },
          thresholds: {
            http_req_failed: [{ threshold: "rate<0.10", abortOnFail: true, delayAbortEval: "20s" }],
          },
        };

        export default function () {
          get("/");
        }

        export const handleSummary = summary("stress");
      K_soak: |
        // Endurance : charge modérée constante (DURATION, défaut 30m). Surveiller RSS / goroutines / FD de la passerelle
        // pendant le run (lab.sh soak lance aussi la collecte docker stats).
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            soak: {
              executor: "constant-arrival-rate",
              rate: Number(__ENV.RATE || 300),
              timeUnit: "1s",
              duration: __ENV.DURATION || "30m",
              preAllocatedVUs: 200,
              maxVUs: 1000,
            },
          },
          thresholds: { http_req_failed: ["rate<0.005"], http_req_duration: ["p(99)<500"] },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.7) get("/");
          else if (r < 0.85) get("/echo");
          else if (r < 0.95) get("/bytes?n=65536");
          else get("/slow?ms=200");
        }

        export const handleSummary = summary("soak");
      K_mixed: |
        // Trafic réaliste : petites/grosses réponses, backend lent, backend instable, uploads, SSE.
        import http from "k6/http";
        import { check } from "k6";
        import { BASE, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "30s", target: 100 },
            { duration: "2m", target: 300 },
            { duration: "30s", target: 0 },
          ],
          thresholds: {
            "http_req_failed{kind:ok}": ["rate<0.01"],
            "http_req_duration{kind:ok}": ["p(95)<400"],
          },
        };

        const payload = "y".repeat(256 * 1024);

        export default function () {
          const r = Math.random();
          let res;
          if (r < 0.5) res = http.get(`$${BASE}/`, { tags: { kind: "ok" } });
          else if (r < 0.65) res = http.get(`$${BASE}/bytes?n=1048576`, { tags: { kind: "ok" } });
          else if (r < 0.75) res = http.get(`$${BASE}/slow?ms=300`, { tags: { kind: "ok" } });
          else if (r < 0.85) res = http.get(`$${BASE}/flaky?p=30`, { tags: { kind: "flaky" } });
          else if (r < 0.95) res = http.post(`$${BASE}/upload`, payload, { tags: { kind: "ok" } });
          else res = http.get(`$${BASE}/sse?n=5&ms=100`, { tags: { kind: "ok" } });
          check(res, { "reponse recue": (x) => x.status > 0 });
        }

        export const handleSummary = summary("mixed");
      K_realistic: |
        // Trafic réaliste sur la boutique simulée (route lab-realistic : 3 instances, health check, retry, rate-limit) :
        // clients web (pages + assets + panier), clients API, lecteurs de flux SSE, échanges WebSocket, téléchargements
        // et envois de fichiers. Débit imposé (modèle ouvert) avec une courbe de journée ; SHOP_RATE = pic d'itérations/s
        // des visiteurs (≈ 8 requêtes chacune). Par défaut ~150 req/s au pic pendant 3 min : faible impact sur la production.
        import http from "k6/http";
        import ws from "k6/ws";
        import { check, sleep, group } from "k6";
        import { summary } from "./common.js";

        const HOST = __ENV.HOST || "lab-realistic.lab.test";
        const BASE = `http://$${HOST}`;
        const PEAK = Number(__ENV.SHOP_RATE || 20);
        const D = __ENV.DURATION || "3m";

        // 404 attendus (liens morts) : ne comptent pas comme échecs.
        http.setResponseCallback(http.expectedStatuses({ min: 200, max: 399 }, 404));

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            visiteurs: {
              executor: "ramping-arrival-rate",
              exec: "visiteur",
              startRate: 1,
              timeUnit: "1s",
              preAllocatedVUs: 50,
              maxVUs: 300,
              stages: [
                { duration: "20s", target: Math.max(2, Math.round(PEAK / 4)) },
                { duration: "1m", target: PEAK },
                { duration: "1m", target: Math.round(PEAK / 2) },
                { duration: "40s", target: 1 },
              ],
            },
            api: { executor: "constant-arrival-rate", exec: "clientApi", rate: Math.max(1, Math.round(PEAK / 2)), timeUnit: "1s", duration: D, preAllocatedVUs: 20, maxVUs: 100 },
            flux: { executor: "constant-vus", exec: "fluxSSE", vus: 3, duration: D },
            chat: { executor: "constant-vus", exec: "chatWS", vus: 3, duration: D },
            fichiers: { executor: "constant-arrival-rate", exec: "fichiers", rate: 1, timeUnit: "2s", duration: D, preAllocatedVUs: 5, maxVUs: 10 },
          },
          thresholds: {
            "http_req_failed{kind:page}": ["rate<0.01"],
            "http_req_failed{kind:api}": ["rate<0.01"],
            "http_req_duration{kind:page}": ["p(95)<300"],
            "http_req_duration{kind:api}": ["p(95)<300"],
            "http_req_duration{kind:slow}": ["p(95)<800"],
            "http_req_duration{kind:asset}": ["p(95)<300"],
            "http_req_duration{kind:sse}": ["p(95)<4000"],
            "http_req_duration{kind:download}": ["p(95)<2000"],
            "http_req_duration{kind:upload}": ["p(95)<2000"],
            "http_req_failed{kind:slow}": ["rate<0.01"],
            "http_req_failed{kind:asset}": ["rate<0.05"],
            "http_req_failed{kind:sse}": ["rate<0.01"],
            "http_req_failed{kind:download}": ["rate<0.01"],
            "http_req_failed{kind:upload}": ["rate<0.01"],
            "checks": ["rate>0.99"],
            "dropped_iterations": ["count==0"],
          },
        };

        const assets = ["/static/app.js", "/static/vendor.js", "/static/style.css", "/static/logo.svg", "/static/fonts.woff2"];
        const pause = (min, max) => sleep(min + Math.random() * (max - min));

        export function visiteur() {
          group("visite", () => {
            let r = http.get(`$${BASE}/`, { tags: { kind: "page" } });
            check(r, { "accueil 200": (x) => x.status === 200 });
            for (const a of assets.slice(0, 3 + Math.floor(Math.random() * 3))) {
              http.get(`$${BASE}$${a}`, { tags: { kind: "asset" } });
            }
            pause(0.5, 2);
            r = http.get(`$${BASE}/api/products`, { tags: { kind: "page" } });
            check(r, { "catalogue JSON": (x) => x.status === 200 && x.json("items.0.name") === "stylo" });
            if (Math.random() < 0.3) {
              pause(0.5, 1.5);
              http.get(`$${BASE}/login`, { tags: { kind: "page" } });
              r = http.post(`$${BASE}/echo`, JSON.stringify({ cart: [1, 2, 3] }), { headers: { "Content-Type": "application/json" }, tags: { kind: "page" } });
              check(r, { "panier accepté": (x) => x.status === 200 });
            }
            if (Math.random() < 0.05) http.get(`$${BASE}/ancienne-page`, { tags: { kind: "page" } }); // 404 légitime côté site
          });
        }

        export function clientApi() {
          const h = { headers: { Authorization: "Bearer lab-token", Accept: "application/json" }, tags: { kind: "api" } };
          const r = http.get(`$${BASE}/api/v1/orders?page=$${1 + Math.floor(Math.random() * 5)}`, h);
          check(r, { "api 200": (x) => x.status === 200 });
          if (Math.random() < 0.1) http.options(`$${BASE}/api/v1/orders`, null, { headers: { Origin: "https://app.lab.test", "Access-Control-Request-Method": "GET" }, tags: { kind: "api" } });
          if (Math.random() < 0.2) http.get(`$${BASE}/slow?ms=$${100 + Math.floor(Math.random() * 400)}`, { tags: { kind: "slow" } });
        }

        export function fluxSSE() {
          const r = http.get(`$${BASE}/sse?n=10&ms=300`, { tags: { kind: "sse" } });
          check(r, { "flux complet": (x) => x.status === 200 && (x.body.match(/data:/g) || []).length === 10 });
          pause(1, 3);
        }

        export function chatWS() {
          const res = ws.connect(`ws://$${HOST}/ws`, {}, (s) => {
            let got = 0;
            s.on("open", () => s.send("bonjour"));
            s.on("message", (m) => {
              got++;
              check(m, { "écho WebSocket": (x) => x.endsWith(":bonjour") || x.endsWith(":msg") });
              if (got < 5) s.setTimeout(() => s.send("msg"), 400);
              else s.close();
            });
            s.setTimeout(() => s.close(), 10000);
          });
          check(res, { "upgrade 101": (r) => r && r.status === 101 });
          pause(1, 4);
        }

        export function fichiers() {
          if (Math.random() < 0.6) {
            const r = http.get(`$${BASE}/bytes?n=2097152`, { tags: { kind: "download" } });
            check(r, { "téléchargement 2 Mo": (x) => x.status === 200 && x.body.length === 2097152 });
          } else {
            const r = http.post(`$${BASE}/upload`, "z".repeat(512 * 1024), { tags: { kind: "upload" } });
            check(r, { "envoi 512 Ko": (x) => x.status === 200 && x.body === String(512 * 1024) });
          }
        }

        export function handleSummary(data) {
          const out = summary("realistic")(data);
          const v = (k, q) => (data.metrics[k] && data.metrics[k].values[q] !== undefined ? data.metrics[k].values[q].toFixed(1) : "-");
          const lines = ["page", "api", "slow", "asset", "sse", "download", "upload"].map(
            (k) => `  $${k.padEnd(9)} p95=$${v(`http_req_duration{kind:$${k}}`, "p(95)")} ms  échecs=$${(Number(v(`http_req_failed{kind:$${k}}`, "rate")) * 100).toFixed(2)} %`,
          );
          const failed = Object.entries(data.metrics).flatMap(([n, m]) => Object.entries(m.thresholds || {}).filter(([, t]) => !t.ok).map(([e]) => `$${n} $${e}`));
          out.stdout += ["par type de requête :", ...lines, `checks     : $${(data.metrics.checks.values.rate * 100).toFixed(2)} % réussis`, failed.length ? `seuils franchis : $${failed.join(" ; ")}` : "tous les seuils respectés", ""].join("\n");
          return out;
        }
      K_hosts: |
        #!/bin/sh
        # Résout *.lab.test vers l'IP de la passerelle (trouvée par DNS Docker) : évite EDGE_IP et extra_hosts.
        # La liste doit contenir tous les hôtes de feature-routes.json (features.sh le vérifie).
        ip=$$(getent hosts "$${EDGE_HOST:-goproxify-edge}" | awk '{print $$1; exit}')
        [ -n "$$ip" ] || { echo "goproxify-edge introuvable sur goproxify_net (stack principale démarrée ?)" >&2; exit 1; }
        grep -v '\.lab\.test' /etc/hosts > /tmp/hosts.new
        for h in lab-fast lab-waf-block lab-waf-detect lab-ratelimit lab-chaos lab-juice \
          lab-lb lab-lb-alias lab-weighted lab-sticky lab-health lab-retry lab-noretry lab-cb lab-transform lab-paths \
          lab-redirect lab-subfilter lab-cors lab-cache lab-ipallow lab-ipdeny lab-vars lab-backpressure lab-limitconn lab-canary \
          lab-canary-pct lab-shadow lab-cond lab-errpages lab-ws lab-nows lab-body lab-secheaders lab-timeout \
          lab-basicauth lab-bot lab-wafcustom lab-nohost lab-toggle lab-realistic; do
          echo "$$ip $$h.lab.test" >> /tmp/hosts.new
        done
        cat /tmp/hosts.new > /etc/hosts


  # Applications simulées pour features.sh et realistic.js : boutique à 3 instances (9001-9003), canary (9004),
  # shadow (9005), legacy (9006), écho TCP (9100) ; pilotage de l'état sur 9999 (réseau interne uniquement, aucun port publié).
  lab-sim:
    image: golang:1.22-alpine
    container_name: lab-sim
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["sh", "-c", "mkdir -p /app && printf %s \"$$SIM_main\" > /app/main.go && exec go run /app/main.go"]
    networks: [goproxify_net]
    environment:
      SIM_main: |
        // lab-sim : applications simulées derrière la passerelle (source canonique, embarquée par gen-compose.sh).
        //
        // Plusieurs "instances" d'une même boutique écoutent sur des ports distincts (équilibrage, canary, shadow,
        // santé, failover) ; un port de contrôle (9999) pilote leur état sans passer par la passerelle.
        package main

        import (
        	"crypto/sha1"
        	"encoding/base64"
        	"encoding/json"
        	"fmt"
        	"io"
        	"net"
        	"net/http"
        	"os"
        	"strconv"
        	"strings"
        	"sync"
        	"sync/atomic"
        	"time"
        )

        type instance struct {
        	id      string
        	port    int
        	healthy atomic.Bool
        	failN   atomic.Int64 // prochaines requêtes applicatives en 503
        	dropN   atomic.Int64 // prochaines requêtes applicatives : connexion coupée sans réponse (panne de transport)
        	latency atomic.Int64 // ms ajoutées à chaque requête applicative
        	hits    atomic.Int64 // requêtes applicatives (hors /healthz)
        	probes  atomic.Int64 // sondes /healthz reçues
        	static  atomic.Int64 // hits d'origine sur /static/*
        	lastMu  sync.Mutex
        	last    map[string]string // dernier en-tête vu par chemin (shadow : preuve de miroir)
        	flaky   sync.Map          // clé -> compteur d'échecs restants (/fail-first)
        }

        var instances = map[string]*instance{}

        func intQ(r *http.Request, k string, def int) int {
        	if v, err := strconv.Atoi(r.URL.Query().Get(k)); err == nil && v >= 0 {
        		return v
        	}
        	return def
        }

        func (in *instance) handler() http.Handler {
        	mux := http.NewServeMux()

        	health := func(w http.ResponseWriter, r *http.Request) {
        		in.probes.Add(1)
        		if !in.healthy.Load() {
        			http.Error(w, "down", http.StatusServiceUnavailable)
        			return
        		}
        		w.WriteHeader(http.StatusNoContent)
        	}
        	mux.HandleFunc("/healthz", health)
        	mux.HandleFunc("/health", health) // chemin sondé par défaut par la passerelle

        	// Page d'accueil : contient l'URL interne du backend (sub_filter, proxy_redirect).
        	mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
        		if r.URL.Path != "/" {
        			http.NotFound(w, r)
        			return
        		}
        		w.Header().Set("Content-Type", "text/html; charset=utf-8")
        		fmt.Fprintf(w, `<!doctype html><html><body><h1>Boutique LAB</h1><p>instance=%s</p>
        <a href="http://lab-sim:%d/products">produits</a><p>BACKEND-MARKER</p></body></html>`, in.id, in.port)
        	})

        	mux.HandleFunc("/whoami", func(w http.ResponseWriter, r *http.Request) { fmt.Fprint(w, in.id) })

        	mux.HandleFunc("/echo", func(w http.ResponseWriter, r *http.Request) {
        		body, _ := io.ReadAll(io.LimitReader(r.Body, 1<<20))
        		w.Header().Set("Content-Type", "application/json")
        		_ = json.NewEncoder(w).Encode(map[string]any{
        			"instance": in.id, "method": r.Method, "host": r.Host, "uri": r.RequestURI, "path": r.URL.Path,
        			"remote": r.RemoteAddr, "headers": r.Header, "cookies": r.Cookies(), "body_len": len(body),
        		})
        	})

        	mux.HandleFunc("/api/", func(w http.ResponseWriter, r *http.Request) {
        		w.Header().Set("Content-Type", "application/json")
        		w.Header().Set("Server", "lab-sim/1.0")
        		w.Header().Set("X-Powered-By", "lab-sim")
        		fmt.Fprintf(w, `{"instance":%q,"path":%q,"marker":%q,"secret":%q,"items":[{"id":1,"name":"stylo"},{"id":2,"name":"cahier"}]}`, in.id, r.URL.Path, r.Header.Get("X-Lab-Marker"), r.Header.Get("X-Secret-Client"))
        	})

        	// Session : cookie lié au domaine/chemin interne (proxy_cookie_domain / proxy_cookie_path).
        	mux.HandleFunc("/login", func(w http.ResponseWriter, r *http.Request) {
        		http.SetCookie(w, &http.Cookie{Name: "sid", Value: "s-" + in.id, Domain: "lab-sim", Path: "/app", HttpOnly: true})
        		fmt.Fprint(w, "logged-in")
        	})

        	// Redirection vers l'URL interne (proxy_redirect).
        	mux.HandleFunc("/redirect", func(w http.ResponseWriter, r *http.Request) {
        		http.Redirect(w, r, fmt.Sprintf("http://lab-sim:%d/landing", in.port), http.StatusFound)
        	})

        	// Ressource statique cacheable : X-Origin-Hit ne change pas tant que le cache sert la réponse.
        	mux.HandleFunc("/static/", func(w http.ResponseWriter, r *http.Request) {
        		n := in.static.Add(1)
        		w.Header().Set("Cache-Control", "public, max-age=60")
        		w.Header().Set("Content-Type", "application/javascript")
        		w.Header().Set("X-Origin-Hit", strconv.FormatInt(n, 10))
        		fmt.Fprintf(w, "console.log('lab asset %s');", r.URL.Path)
        	})

        	mux.HandleFunc("/status/", func(w http.ResponseWriter, r *http.Request) {
        		code, err := strconv.Atoi(strings.TrimPrefix(r.URL.Path, "/status/"))
        		if err != nil || code < 100 || code > 599 {
        			code = http.StatusBadRequest
        		}
        		w.WriteHeader(code)
        		fmt.Fprintf(w, "status %d from %s", code, in.id)
        	})

        	// Échoue n fois par clé, puis réussit : valide la politique de retry.
        	mux.HandleFunc("/fail-first", func(w http.ResponseWriter, r *http.Request) {
        		key := r.URL.Query().Get("key")
        		v, _ := in.flaky.LoadOrStore(key, new(atomic.Int64))
        		c := v.(*atomic.Int64)
        		if c.Add(1) <= int64(intQ(r, "n", 2)) {
        			http.Error(w, "boom", http.StatusBadGateway)
        			return
        		}
        		fmt.Fprint(w, "recovered")
        	})

        	mux.HandleFunc("/slow", func(w http.ResponseWriter, r *http.Request) {
        		time.Sleep(time.Duration(intQ(r, "ms", 500)) * time.Millisecond)
        		fmt.Fprint(w, "slow ok")
        	})

        	mux.HandleFunc("/bytes", func(w http.ResponseWriter, r *http.Request) {
        		n := intQ(r, "n", 1024)
        		w.Header().Set("Content-Type", "application/octet-stream")
        		w.Header().Set("Content-Length", strconv.Itoa(n))
        		chunk := []byte(strings.Repeat("x", 4096))
        		for n > 0 {
        			c := min(n, len(chunk))
        			if _, err := w.Write(chunk[:c]); err != nil {
        				return
        			}
        			n -= c
        		}
        	})

        	mux.HandleFunc("/upload", func(w http.ResponseWriter, r *http.Request) {
        		n, _ := io.Copy(io.Discard, r.Body)
        		fmt.Fprintf(w, "%d", n)
        	})

        	mux.HandleFunc("/sse", func(w http.ResponseWriter, r *http.Request) {
        		fl, ok := w.(http.Flusher)
        		if !ok {
        			http.Error(w, "no flush", http.StatusInternalServerError)
        			return
        		}
        		w.Header().Set("Content-Type", "text/event-stream")
        		for i := 0; i < intQ(r, "n", 10); i++ {
        			fmt.Fprintf(w, "data: %d\n\n", i)
        			fl.Flush()
        			select {
        			case <-r.Context().Done():
        				return
        			case <-time.After(time.Duration(intQ(r, "ms", 200)) * time.Millisecond):
        			}
        		}
        	})

        	mux.HandleFunc("/ws", func(w http.ResponseWriter, r *http.Request) { echoWS(w, r, in.id) })

        	return in.wrap(mux)
        }

        // wrap applique latence, pannes simulées et compteurs ; /healthz n'est jamais compté ni ralenti.
        func (in *instance) wrap(next http.Handler) http.Handler {
        	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        		w.Header().Set("X-Instance", in.id)
        		if r.URL.Path == "/healthz" || r.URL.Path == "/health" {
        			next.ServeHTTP(w, r)
        			return
        		}
        		in.hits.Add(1)
        		in.lastMu.Lock()
        		in.last[r.URL.Path] = r.Header.Get("X-Lab-Marker")
        		in.lastMu.Unlock()
        		if ms := in.latency.Load(); ms > 0 {
        			time.Sleep(time.Duration(ms) * time.Millisecond)
        		}
        		if in.dropN.Load() > 0 && in.dropN.Add(-1) >= 0 {
        			if hj, ok := w.(http.Hijacker); ok {
        				if c, _, err := hj.Hijack(); err == nil {
        					c.Close()
        					return
        				}
        			}
        		}
        		if in.failN.Load() > 0 && in.failN.Add(-1) >= 0 {
        			http.Error(w, "simulated failure", http.StatusServiceUnavailable)
        			return
        		}
        		next.ServeHTTP(w, r)
        	})
        }

        // echoWS : poignée de main WebSocket minimale + écho des trames texte (charges < 126 octets).
        func echoWS(w http.ResponseWriter, r *http.Request, id string) {
        	key := r.Header.Get("Sec-WebSocket-Key")
        	if !strings.EqualFold(r.Header.Get("Upgrade"), "websocket") || key == "" {
        		http.Error(w, "upgrade required", http.StatusUpgradeRequired)
        		return
        	}
        	hj, ok := w.(http.Hijacker)
        	if !ok {
        		http.Error(w, "no hijack", http.StatusInternalServerError)
        		return
        	}
        	conn, rw, err := hj.Hijack()
        	if err != nil {
        		return
        	}
        	defer conn.Close()
        	sum := sha1.Sum([]byte(key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"))
        	fmt.Fprintf(rw, "HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: %s\r\nX-Instance: %s\r\n\r\n",
        		base64.StdEncoding.EncodeToString(sum[:]), id)
        	rw.Flush()
        	for {
        		_ = conn.SetReadDeadline(time.Now().Add(30 * time.Second))
        		hdr := make([]byte, 2)
        		if _, err := io.ReadFull(rw, hdr); err != nil {
        			return
        		}
        		op, n := hdr[0]&0x0f, int(hdr[1]&0x7f)
        		if op == 0x8 || n >= 126 {
        			return
        		}
        		var mask [4]byte
        		if hdr[1]&0x80 != 0 {
        			if _, err := io.ReadFull(rw, mask[:]); err != nil {
        				return
        			}
        		}
        		payload := make([]byte, n)
        		if _, err := io.ReadFull(rw, payload); err != nil {
        			return
        		}
        		for i := range payload {
        			payload[i] ^= mask[i%4]
        		}
        		reply := append([]byte(id+":"), payload...)
        		if len(reply) >= 126 {
        			return
        		}
        		rw.Write(append([]byte{0x81, byte(len(reply))}, reply...))
        		rw.Flush()
        	}
        }

        func control() http.Handler {
        	mux := http.NewServeMux()
        	// /ctl/<id>/<health|fail|latency|reset>?...
        	mux.HandleFunc("/ctl/", func(w http.ResponseWriter, r *http.Request) {
        		parts := strings.Split(strings.Trim(strings.TrimPrefix(r.URL.Path, "/ctl/"), "/"), "/")
        		if parts[0] == "stats" {
        			out := map[string]any{}
        			for id, in := range instances {
        				in.lastMu.Lock()
        				last := map[string]string{}
        				for k, v := range in.last {
        					last[k] = v
        				}
        				in.lastMu.Unlock()
        				out[id] = map[string]any{"hits": in.hits.Load(), "probes": in.probes.Load(), "static": in.static.Load(), "healthy": in.healthy.Load(), "last_marker": last}
        			}
        			w.Header().Set("Content-Type", "application/json")
        			_ = json.NewEncoder(w).Encode(out)
        			return
        		}
        		if parts[0] == "reset" {
        			for _, in := range instances {
        				in.healthy.Store(true)
        				in.failN.Store(0)
        				in.dropN.Store(0)
        				in.latency.Store(0)
        				in.hits.Store(0)
        				in.static.Store(0)
        				in.flaky.Range(func(k, _ any) bool { in.flaky.Delete(k); return true })
        			}
        			fmt.Fprint(w, "reset")
        			return
        		}
        		in := instances[parts[0]]
        		if in == nil || len(parts) < 2 {
        			http.NotFound(w, r)
        			return
        		}
        		switch parts[1] {
        		case "health":
        			in.healthy.Store(r.URL.Query().Get("up") != "0")
        		case "fail":
        			in.failN.Store(int64(intQ(r, "n", 1)))
        		case "drop":
        			in.dropN.Store(int64(intQ(r, "n", 1)))
        		case "latency":
        			in.latency.Store(int64(intQ(r, "ms", 0)))
        		case "reset":
        			in.healthy.Store(true)
        			in.failN.Store(0)
        			in.dropN.Store(0)
        			in.latency.Store(0)
        		default:
        			http.NotFound(w, r)
        			return
        		}
        		fmt.Fprint(w, "ok")
        	})
        	return mux
        }

        func tcpEcho(addr string) {
        	l, err := net.Listen("tcp", addr)
        	if err != nil {
        		fmt.Fprintln(os.Stderr, err)
        		return
        	}
        	for {
        		c, err := l.Accept()
        		if err != nil {
        			return
        		}
        		go func() {
        			defer c.Close()
        			fmt.Fprint(c, "LAB-TCP-BANNER\n")
        			io.Copy(c, c)
        		}()
        	}
        }

        func main() {
        	// a/b/c : pool de la boutique ; canary/shadow/legacy : hors pool ; h1/h2 : sondes de santé (une config de sonde est partagée par URL de backend) ;
        	// le port 9009 n'est volontairement pas écouté (backend mort).
        	for id, port := range map[string]int{"a": 9001, "b": 9002, "c": 9003, "canary": 9004, "shadow": 9005, "legacy": 9006, "h1": 9007, "h2": 9008} {
        		in := &instance{id: id, port: port, last: map[string]string{}}
        		in.healthy.Store(true)
        		instances[id] = in
        		go func() {
        			srv := &http.Server{Addr: fmt.Sprintf(":%d", in.port), Handler: in.handler(), ReadHeaderTimeout: 10 * time.Second}
        			if err := srv.ListenAndServe(); err != nil {
        				fmt.Fprintln(os.Stderr, err)
        				os.Exit(1)
        			}
        		}()
        	}
        	go tcpEcho(":9100")
        	srv := &http.Server{Addr: ":9999", Handler: control(), ReadHeaderTimeout: 10 * time.Second}
        	if err := srv.ListenAndServe(); err != nil {
        		fmt.Fprintln(os.Stderr, err)
        		os.Exit(1)
        	}
        }

