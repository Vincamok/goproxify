{{- if .Values.edge.enabled -}}
apiVersion: apps/v1
kind: {{ .Values.edge.kind }}
metadata:
  name: {{ include "goproxify.fullname" . }}-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  {{- if eq .Values.edge.kind "Deployment" }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "goproxify.name" . }}
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "goproxify.name" . }}
        app.kubernetes.io/component: edge
      annotations:
        # Un changement de secret redémarre les pods : les variables d'environnement tirées d'un Secret ne se relisent pas.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.security.edgeHostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ include "goproxify.serviceAccountName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: "{{ .Values.global.image.registry }}/edge:{{ .Values.edge.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.edge.config.httpPort }}
              {{- if .Values.security.edgeHostNetwork }}
              hostPort: {{ .Values.edge.config.httpPort }}
              {{- end }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.edge.config.httpsPort }}
              {{- if .Values.security.edgeHostNetwork }}
              hostPort: {{ .Values.edge.config.httpsPort }}
              {{- end }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.edge.config.internalAPIPort }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.global.timezone | default "Europe/Paris" | quote }}
            {{- if .Values.security.edgeWithoutRootSecret }}
            {{- if ne .Values.edge.kind "Deployment" }}
            {{- fail "security.edgeWithoutRootSecret exige edge.kind=Deployment : la clé de la passerelle dépend de son nom, que le chart ne connaît d'avance que pour un Deployment (voir docs/deployment.md)" }}
            {{- end }}
            # Sans le secret racine : la clé du canal Admin → passerelle (dérivée du nom) et la clé des Agents.
            - name: GPX_EDGE_CHANNEL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: edge-channel-key
            - name: GPX_AGENT_PAIRING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: agent-pairing-key
            {{- if .Values.global.portalMasterKey }}
            - name: GPX_PORTAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: portal-master-key
            {{- end }}
            {{- if .Values.global.previousPairingSecret }}
            # Rotation : les clés dérivées des secrets précédents, acceptées le temps de la bascule.
            - name: GPX_EDGE_CHANNEL_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: previous-edge-channel-key
            - name: GPX_AGENT_PAIRING_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: previous-agent-pairing-key
            {{- end }}
            {{- else }}
            - name: GPX_PAIRING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: pairing-secret
            {{- end }}
            # Nœuds nommés d'après le nœud Kubernetes à l'appairage comme ensuite : un Agent ne peut pas agir au nom d'un autre.
            {{- if and .Values.global.previousPairingSecret (not .Values.security.edgeWithoutRootSecret) }}
            # Rotation du secret : l'ancien ne sert qu'à relire les copies locales chiffrées (routes, certificats, plugins).
            - name: GPX_PAIRING_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: previous-pairing-secret
            {{- end }}
            {{- if .Values.global.pluginTrustedKeys }}
            # Clés publiques épinglées : la passerelle refuse tout plugin qui n'est pas signé par l'une d'elles, même poussé par l'Admin.
            - name: GPX_PLUGIN_TRUSTED_KEYS
              value: {{ .Values.global.pluginTrustedKeys | quote }}
            {{- end }}
            - name: GPX_AGENT_BIND_IDENTITY
              value: "true"
            - name: GPX_AGENT_PAIRING_ROOT
              value: {{ .Values.security.agentPairingWithRootSecret | default false | quote }}
            # Une passerelle par nœud : sans nom propre, toutes se nommeraient « goproxify-edge » et partageraient
            # la même identité (jeton, routes) auprès de l'Admin.
            - name: GPX_IDENTITY_EDGE_NODE_NAME
              {{- if eq .Values.edge.kind "Deployment" }}
              value: {{ include "goproxify.fullname" . }}-edge
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
              {{- end }}
            # Adresse sous laquelle l'Admin joint cette passerelle (API interne).
            - name: GPX_NETWORK_API_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GPX_NETWORK_HTTP_PORT
              value: {{ .Values.edge.config.httpPort | quote }}
            - name: GPX_NETWORK_HTTPS_PORT
              value: {{ .Values.edge.config.httpsPort | quote }}
            - name: GPX_NETWORK_INTERNAL_API_PORT
              value: {{ .Values.edge.config.internalAPIPort | quote }}
          volumeMounts:
            - name: data
              # edge.json (identité), certificats chiffrés, routes, bans : doivent survivre à un redémarrage du pod.
              mountPath: /etc/goproxify
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            capabilities:
              {{- if .Values.security.dropAllCapabilities }}
              drop: ["ALL"]
              {{- end }}
              add: ["NET_BIND_SERVICE"]
      volumes:
        - name: data
          {{- if .Values.edge.persistence.hostPath }}
          hostPath:
            path: {{ .Values.edge.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Trafic public (80/443) : utile quand la passerelle n'est pas en hostNetwork.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goproxify.fullname" . }}-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  type: {{ .Values.edge.service.type }}
  ports:
    - name: http
      port: {{ .Values.edge.service.httpPort }}
      targetPort: http
      {{- if eq .Values.edge.service.type "NodePort" }}
      nodePort: {{ .Values.edge.service.nodePortHTTP }}
      {{- end }}
    - name: https
      port: {{ .Values.edge.service.httpsPort }}
      targetPort: https
      {{- if eq .Values.edge.service.type "NodePort" }}
      nodePort: {{ .Values.edge.service.nodePortHTTPS }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "goproxify.name" . }}
    app.kubernetes.io/component: edge
---
# API interne (Admin, Agents) : ClusterIP uniquement, jamais exposée hors du cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goproxify.fullname" . }}-edge-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  ports:
    - name: internal
      port: {{ .Values.edge.config.internalAPIPort }}
      targetPort: internal
  selector:
    app.kubernetes.io/name: {{ include "goproxify.name" . }}
    app.kubernetes.io/component: edge
{{- end }}
