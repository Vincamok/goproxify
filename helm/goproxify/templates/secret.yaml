apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goproxify.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Secret de couplage : le même pour l'Admin, la passerelle et l'Agent (GPX_PAIRING_SECRET). global.authToken est l'ancien nom. */}}
  pairing-secret: {{ required "global.pairingSecret est requis (openssl rand -hex 32)" (default .Values.global.authToken .Values.global.pairingSecret) | quote }}
  {{- /* Clé dérivée remise aux Agents : elle suffit à s'appairer mais ne permet pas de se faire passer pour l'Admin auprès des passerelles (le secret racine, lui, signe le WebSocket Admin → passerelle). Même calcul que internal/pairing.AgentKey. */}}
  {{- if .Values.global.previousPairingSecret }}
  previous-pairing-secret: {{ .Values.global.previousPairingSecret | quote }}
  {{- end }}
  agent-pairing-key: {{ printf "goproxify/agent-pairing/v1:%s" (default .Values.global.authToken .Values.global.pairingSecret) | sha256sum | quote }}
  {{- if .Values.global.previousPairingSecret }}
  {{- /* Rotation : les clés dérivées des secrets précédents (séparés par des virgules), acceptées le temps de la bascule. */}}
  {{- $name := printf "%s-edge" (include "goproxify.fullname" .) }}
  {{- $prevChannel := list }}
  {{- $prevAgent := list }}
  {{- range (splitList "," .Values.global.previousPairingSecret) }}
  {{- $prevChannel = append $prevChannel (printf "goproxify/edge-channel/v1:%s:%s" $name (trim .) | sha256sum) }}
  {{- $prevAgent = append $prevAgent (printf "goproxify/agent-pairing/v1:%s" (trim .) | sha256sum) }}
  {{- end }}
  previous-edge-channel-key: {{ join "," $prevChannel | quote }}
  previous-agent-pairing-key: {{ join "," $prevAgent | quote }}
  {{- end }}
  {{- if .Values.security.edgeWithoutRootSecret }}
  {{- /* Clé du canal Admin → passerelle : dérivée du nom de la passerelle (celui de son Deployment). Même calcul que internal/pairing.EdgeChannelKey. */}}
  edge-channel-key: {{ printf "goproxify/edge-channel/v1:%s-edge:%s" (include "goproxify.fullname" .) (default .Values.global.authToken .Values.global.pairingSecret) | sha256sum | quote }}
  {{- if .Values.global.portalMasterKey }}
  portal-master-key: {{ .Values.global.portalMasterKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.admin.config.jwtSecret }}
  jwt-secret: {{ .Values.admin.config.jwtSecret | quote }}
  {{- end }}
