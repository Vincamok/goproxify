apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goproxify.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Secret de couplage : le même pour l'Admin, la passerelle et l'Agent (GPX_PAIRING_SECRET). global.authToken est l'ancien nom. */}}
  pairing-secret: {{ required "global.pairingSecret est requis (openssl rand -hex 32)" (default .Values.global.authToken .Values.global.pairingSecret) | quote }}
  {{- /* Clé dérivée remise aux Agents : elle suffit à s'appairer mais ne permet pas de se faire passer pour l'Admin auprès des passerelles (le secret racine, lui, signe le WebSocket Admin → passerelle). Même calcul que internal/pairing.AgentKey. */}}
  {{- if .Values.global.previousPairingSecret }}
  previous-pairing-secret: {{ .Values.global.previousPairingSecret | quote }}
  {{- end }}
  agent-pairing-key: {{ printf "goproxify/agent-pairing/v1:%s" (default .Values.global.authToken .Values.global.pairingSecret) | sha256sum | quote }}
  {{- if .Values.admin.config.jwtSecret }}
  jwt-secret: {{ .Values.admin.config.jwtSecret | quote }}
  {{- end }}
