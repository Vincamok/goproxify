{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "goproxify.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "goproxify.name" . }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "goproxify.name" . }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "goproxify.serviceAccountName" . }}
      {{- if .Values.security.agentHostPID }}
      hostPID: true
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.global.image.registry }}/agent:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | default "Europe/Paris" | quote }}
            - name: GPX_CONTROL_PLANE_CORE_ENDPOINT
              value: http://{{ include "goproxify.fullname" . }}-core:{{ .Values.core.service.internalPort }}
            - name: GPX_CONTROL_PLANE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: auth-token
            - name: GPX_DOCKER_RUNTIME
              value: {{ .Values.agent.config.runtime | quote }}
            - name: GPX_KUBERNETES_ENABLED
              value: {{ .Values.agent.config.kubernetes.enabled | quote }}
            - name: GPX_KUBERNETES_NAMESPACE
              value: {{ .Values.agent.config.kubernetes.namespace | quote }}
            - name: GPX_IDENTITY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: {{ .Values.security.agentDockerSockReadOnly }}
            - name: podman-sock
              mountPath: /run/podman/podman.sock
              readOnly: {{ .Values.security.agentDockerSockReadOnly }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            runAsUser: 0
            {{- if .Values.security.dropAllCapabilities }}
            capabilities:
              drop: ["ALL"]
            {{- end }}
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: FileOrCreate
        - name: podman-sock
          hostPath:
            path: /run/podman/podman.sock
            type: FileOrCreate
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
