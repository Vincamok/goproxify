{{- if .Values.core.enabled -}}
apiVersion: apps/v1
kind: {{ .Values.core.kind }}
metadata:
  name: {{ include "goproxify.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  {{- if eq .Values.core.kind "Deployment" }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "goproxify.name" . }}
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "goproxify.name" . }}
        app.kubernetes.io/component: core
    spec:
      {{- if .Values.security.coreHostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ include "goproxify.serviceAccountName" . }}
      containers:
        - name: core
          image: "{{ .Values.global.image.registry }}/core:{{ .Values.core.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.core.config.httpPort }}
              {{- if .Values.security.coreHostNetwork }}
              hostPort: {{ .Values.core.config.httpPort }}
              {{- end }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.core.config.httpsPort }}
              {{- if .Values.security.coreHostNetwork }}
              hostPort: {{ .Values.core.config.httpsPort }}
              {{- end }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.core.config.internalAPIPort }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.global.timezone | default "Europe/Paris" | quote }}
            - name: GPX_CONTROL_PLANE_ADMIN_ENDPOINT
              value: {{ if .Values.core.config.adminEndpoint }}{{ .Values.core.config.adminEndpoint }}{{ else }}http://{{ include "goproxify.fullname" . }}-admin:{{ .Values.admin.service.apiPort }}{{ end }}
            - name: GPX_CONTROL_PLANE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "goproxify.fullname" . }}-secret
                  key: auth-token
            - name: GPX_NETWORK_HTTP_PORT
              value: {{ .Values.core.config.httpPort | quote }}
            - name: GPX_NETWORK_HTTPS_PORT
              value: {{ .Values.core.config.httpsPort | quote }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            capabilities:
              {{- if .Values.security.dropAllCapabilities }}
              drop: ["ALL"]
              {{- end }}
              add: ["NET_BIND_SERVICE"]
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
