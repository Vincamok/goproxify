{{- if and .Values.agent.enabled .Values.agent.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "goproxify.fullname" . }}-agent
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "goproxify.fullname" . }}-agent
  labels:
    {{- include "goproxify.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "goproxify.fullname" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "goproxify.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
