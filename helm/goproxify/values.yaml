# Valeurs par défaut du chart Helm Goproxify.

global:
  image:
    registry: ghcr.io/vincamok/goproxify
    pullPolicy: IfNotPresent
  # Secret de couplage partagé par l'Admin, la passerelle et l'Agent (GPX_PAIRING_SECRET) : obligatoire.
  # Générez-le : openssl rand -hex 32. Ne le réutilisez pas entre environnements.
  pairingSecret: ""
  # Rotation : l'ancien secret, le temps que les passerelles réécrivent leurs copies locales avec le nouveau
  # (plusieurs secrets séparés par des virgules). À retirer ensuite. Voir docs/deployment.md.
  previousPairingSecret: ""
  # Ancien nom de pairingSecret, encore lu s'il est renseigné.
  authToken: ""
  # Fuseau horaire des pods (crons, logs locaux, horloge admin)
  timezone: "Europe/Paris"

# ── Administration ────────────────────────────────────────────────────────────
admin:
  enabled: true
  replicaCount: 1
  image:
    tag: "preview"
  service:
    type: ClusterIP
    apiPort: 8080
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
  # Passerelles que l'Admin doit joindre : [{name: <nom de la passerelle>, url: http://<adresse>:8000}].
  # Avec edge.kind=Deployment c'est automatique ; avec un DaemonSet, le nom est celui du nœud (spec.nodeName) et
  # l'adresse celle du nœud (hostNetwork) — à déclarer ici ou depuis l'Admin (Infrastructure).
  edgeEndpoints: []
  config:
    listenAddr: "0.0.0.0"
    apiPort: 8080
    setupMode: false
    jwtSecret: ""  # Généré automatiquement si vide
    # Scanner CVE : autoriser backends privés (Docker/LAN). Défaut false (anti-SSRF).
    vulnscanAllowPrivate: false
    # Optionnel — chiffrement snapshots / tokens nœuds (sinon JWT pour tokens).
    backupKey: ""
    nodeTokenKey: ""
  ingress:
    enabled: false
    className: ""
    host: admin.example.com
    tls: []

# ── passerelle (reverse proxy) ──────────────────────────────────────────────────────
edge:
  enabled: true
  # DaemonSet pour exposer les ports 80/443 sur chaque nœud
  kind: DaemonSet
  # hostNetwork requis pour binder 80/443 sur l'hôte ; désactiver seulement avec
  # un Service NodePort/LoadBalancer dédié (voir security.edgeHostNetwork).
  image:
    tag: "preview"
  service:
    type: NodePort
    httpPort: 80
    httpsPort: 443
    nodePortHTTP: 30080
    nodePortHTTPS: 30443
  resources:
    requests: { cpu: "200m", memory: "128Mi" }
    limits:   { cpu: "1000m", memory: "512Mi" }
  config:
    adminEndpoint: ""  # URL de l'Administration (auto-détectée si vide)
    httpPort: 80
    httpsPort: 443
    internalAPIPort: 8000
  # La passerelle garde son identité, ses certificats chiffrés et ses routes dans /etc/goproxify : sans volume
  # persistant elle repartirait de zéro (nouvelle identité) à chaque redémarrage du pod. Un dossier de l'hôte par nœud.
  persistence:
    hostPath: /var/lib/goproxify/edge

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  enabled: true
  # Nœuds qui reçoivent un Agent (par exemple ceux qui exécutent Docker) ; s'ajoute à nodeSelector global.
  nodeSelector: {}
  persistence:
    hostPath: /var/lib/goproxify/agent
  # DaemonSet : un Agent par nœud K8s
  image:
    tag: "preview"
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
  config:
    # Socket du runtime de conteneurs de l'hôte, monté dans l'Agent pour découvrir et piloter ses conteneurs.
    #   none   : aucun socket (défaut) — découverte Kubernetes seulement ; rien du nœud n'est monté
    #   docker : monte /var/run/docker.sock   (le nœud DOIT l'avoir, sinon le pod ne démarre pas)
    #   podman : monte /run/podman/podman.sock (idem)
    # Un socket de runtime donne le contrôle de l'hôte : ne l'activez que sur les nœuds qui en ont besoin
    # (agent.nodeSelector), pas sur tout le cluster.
    runtime: "none"
    labelPrefix: "goproxify."
    kubernetes:
      enabled: true           # Activer la découverte K8s in-cluster
      namespace: ""           # "" = tous les namespaces
    telemetry:
      enabled: true
      metricsPort: 9191
    logForwarding:
      enabled: true
      bufferLines: 500
    autoScale:
      enabled: false
    healthEscalation:
      enabled: true
      restartMaxRetries: 3
      recreateTimeoutS: 60
      checkIntervalS: 30
  # RBAC pour la découverte K8s
  rbac:
    create: true

# ── Durcissement sécurité (H9) ────────────────────────────────────────────────
# Trade-offs documentés : Passerelle a souvent besoin de hostNetwork ; Agent a besoin
# du socket runtime (RO) pour la découverte. hostPID Agent désactivé par défaut.
security:
  edgeHostNetwork: true
  agentHostPID: false
  # « readOnly » sur un socket n'empêche PAS d'écrire : on se connecte au socket et on envoie n'importe quelle
  # requête. Ce réglage ne protège donc pas l'hôte ; il ne fait que décrire l'intention du montage.
  agentDockerSockReadOnly: true
  # Accepter qu'un Agent s'appaire avec le secret racine (anciennes installations qui le lui ont donné). Défaut false :
  # l'Agent reçoit la clé dérivée (secret agent-pairing-key), qui ne permet pas de se faire passer pour l'Admin.
  agentPairingWithRootSecret: false
  # Admin : utilisateur non privilégié (l'image n'en déclare pas, elle tournait en root), profil seccomp du runtime,
  # aucune capacité. 0 = revenir à root. readOnlyRootFilesystem n'est pas activé par défaut : à tester avec vos
  # usages (sauvegardes, GeoIP) ; /tmp est déjà un volume.
  adminRunAsUser: 10001
  adminReadOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  dropAllCapabilities: true

# ── Paramètres globaux K8s ────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
