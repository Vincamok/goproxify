# =============================================================================
# GOPROXIFY — Stack complète (Admin + Core + Agent)
#
# Démarrage rapide :
#   1. cp .env.example .env   →   remplir les 4 variables OBLIGATOIRE
#   2. docker compose up -d
#   3. Ouvrir http://votre-ip:9443
#
# Architecture :
#   Admin (9443) ──WS──▶ Core (8000 interne, 80/443 public)
#                              ◀──WS── Agent
#
# Multi-machine (Admin et Core sur des serveurs séparés) :
#   - Sur l'Admin : GPX_IDENTITY_CORE_NODE_NAME=<ip-ou-hostname-du-core>
#   - Sur le Core : exposer le port 8000 et ouvrir le firewall
#   - Sur l'Agent : GPX_CONTROL_PLANE_CORE_ENDPOINT=http://<ip-core>:8000
# =============================================================================

networks:
  goproxify_net:
    driver: bridge
    name: goproxify_net

volumes:
  goproxify_admin_data:
    driver: local
  goproxify_core_data:
    driver: local
  goproxify_agent_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # ADMIN — Interface de gestion (port 9443)
  # Persiste sa configuration en SQLite.
  # Se connecte au Core via WebSocket (GPX_IDENTITY_CORE_NODE_NAME).
  # ---------------------------------------------------------------------------
  goproxify-admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    image: ${GOPROXIFY_REGISTRY:-ghcr.io/vincamok/goproxify}/admin:${GOPROXIFY_ADMIN_TAG:-0.2.75}
    container_name: goproxify-admin
    restart: unless-stopped
    command: ["admin"]
    environment:
      - TZ=${TZ:-Europe/Paris}

      # ── OBLIGATOIRE ────────────────────────────────────────────────────────
      # openssl rand -hex 32
      - GPX_SECURITY_JWT_SECRET=${GPX_JWT_SECRET}
      # Partagé entre Admin, Core et Agent — même valeur partout
      - GPX_PAIRING_SECRET=${GPX_PAIRING_SECRET}
      # Compte administrateur (créé au premier démarrage, ignoré ensuite)
      - GPX_FIRST_ADMIN_EMAIL=${GPX_FIRST_ADMIN_EMAIL}
      - GPX_FIRST_ADMIN_PASSWORD=${GPX_FIRST_ADMIN_PASSWORD}

      # ── Connexion au Core ──────────────────────────────────────────────────
      # Hostname/IP joignable du Core (Docker DNS ou IP multi-machine).
      # Distinct de l'identité heartbeat du Core : même valeur recommandée en mono-node.
      - GPX_IDENTITY_CORE_NODE_NAME=${CORE_NODE_NAME:-goproxify-core}

      # ── Optionnel ──────────────────────────────────────────────────────────
      - GPX_SERVER_API_PORT=9443
      - GPX_ENGINE_LOG_LEVEL=${LOG_LEVEL:-info}
      # URL publique de l'Admin (liens pages d'erreur → Logs). Sinon auto-mémorisée à la 1re connexion UI.
      # Préférer https://… derrière un reverse-proxy TLS (M10).
      - GPX_ADMIN_PUBLIC_URL=${GPX_ADMIN_PUBLIC_URL:-}
      # TLS natif Admin (optionnel) — chemins fichiers montés dans le conteneur
      - GPX_ADMIN_TLS_CERT=${GPX_ADMIN_TLS_CERT:-}
      - GPX_ADMIN_TLS_KEY=${GPX_ADMIN_TLS_KEY:-}

      # Scanner CVE : true pour backends Docker/LAN privés (RFC1918). Défaut false (anti-SSRF).
      - GPX_VULNSCAN_ALLOW_PRIVATE=${GPX_VULNSCAN_ALLOW_PRIVATE:-false}
      # Chiffrement snapshots / tokens nœuds (optionnel)
      - GPX_BACKUP_KEY=${GPX_BACKUP_KEY:-}
      - GPX_NODE_TOKEN_KEY=${GPX_NODE_TOKEN_KEY:-}

      # ── ACME / Let's Encrypt (certificats wildcard automatiques) ───────────
      - GPX_ACME_ENABLED=${GPX_ACME_ENABLED:-false}
      - GPX_ACME_EMAIL=${GPX_ACME_EMAIL:-}
      - GPX_ACME_DNS_TYPE=${GPX_ACME_DNS_TYPE:-}
      # Cloudflare
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      # OVH
      - OVH_ENDPOINT=${OVH_ENDPOINT:-ovh-eu}
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY:-}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET:-}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY:-}
      # Gandi
      - GANDI_API_KEY=${GANDI_API_KEY:-}
      # AWS Route53
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      # Hetzner
      - HETZNER_API_KEY=${HETZNER_API_KEY:-}

      # ── Alerting SMTP ──────────────────────────────────────────────────────
      - GPX_ALERTING_SMTP_HOST=${SMTP_HOST:-}
      - GPX_ALERTING_SMTP_PORT=${SMTP_PORT:-587}
      - GPX_ALERTING_SMTP_USER=${SMTP_USER:-}
      - GPX_ALERTING_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GPX_ALERTING_SMTP_FROM=${SMTP_FROM:-}

    ports:
      - "${ADMIN_PORT:-9443}:9443"
    volumes:
      - goproxify_admin_data:/etc/goproxify
    networks:
      - goproxify_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9443/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # CORE — Reverse proxy HTTP/HTTPS (ports 80 et 443)
  # Hub WebSocket : Admin et Agent s'y connectent (port interne 8000).
  # Reçoit sa configuration depuis Admin via WebSocket au démarrage.
  # ---------------------------------------------------------------------------
  goproxify-core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    image: ${GOPROXIFY_REGISTRY:-ghcr.io/vincamok/goproxify}/core:${GOPROXIFY_CORE_TAG:-0.3.42}
    container_name: goproxify-core
    restart: unless-stopped
    command: ["core"]
    environment:
      - TZ=${TZ:-Europe/Paris}

      # ── OBLIGATOIRE — même valeur que l'Admin ──────────────────────────────
      - GPX_PAIRING_SECRET=${GPX_PAIRING_SECRET}

      # ── Identité du nœud (heartbeat / tokens / certificats UI) ─────────────
      # Sans cette variable, le Core génère un ID stable (core-<hex>) distinct
      # du token "goproxify-core" → Certificats TLS vides pour ce nœud.
      - GPX_IDENTITY_CORE_NODE_NAME=${CORE_NODE_NAME:-goproxify-core}

      # ── Optionnel ──────────────────────────────────────────────────────────
      - GPX_ENGINE_LOG_LEVEL=${LOG_LEVEL:-info}
      # GeoIP : voir geoip.* dans services/core/config.json (surcharge env optionnelle)
      # - GPX_GEOIP_AUTO_DOWNLOAD=false
      # - GPX_GEOIP_DB_PATH=/etc/goproxify/geoip/GeoLite2-Country.mmdb
      # - GPX_GEOIP_DB_URL=https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

    ports:
      - "${CORE_HTTP_PORT:-80}:80"
      - "${CORE_HTTPS_PORT:-443}:443"
      - "${CORE_HTTPS_PORT:-443}:443/udp"
      # Port 8000 (hub WS) : non exposé en mono-machine (réseau interne suffit).
      # Décommenter pour multi-machine (Admin ou Agent sur un autre serveur) :
      # - "8000:8000"

    volumes:
      # Persistance Core : cache, tokens, GeoIP, proxies/*.json, proxies-revisions/
      # (volume distinct de l'Admin — ne pas chercher proxies/ dans goproxify-admin)
      - goproxify_core_data:/etc/goproxify
    networks:
      - goproxify_net
    depends_on:
      goproxify-admin:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AGENT — Découverte automatique des conteneurs Docker (optionnel)
  # Se connecte au Core via WebSocket pour remonter les conteneurs détectés.
  # L'Agent entre en état "pending" au premier démarrage et doit être
  # approuvé dans l'interface Admin (menu Agents).
  # ---------------------------------------------------------------------------
  goproxify-agent:
    image: ${GOPROXIFY_REGISTRY:-ghcr.io/vincamok/goproxify}/agent:${GOPROXIFY_AGENT_TAG:-0.3.25}
    container_name: goproxify-agent
    restart: unless-stopped
    command: ["agent"]
    environment:
      - TZ=${TZ:-Europe/Paris}

      # ── OBLIGATOIRE — même valeur que l'Admin et le Core ───────────────────
      - GPX_PAIRING_SECRET=${GPX_PAIRING_SECRET}

      # ── Connexion au Core (mono-machine : réseau Docker suffit) ───────────
      # Sur réseau isolé Docker, http:// est OK. Hors réseau de confiance : HTTPS + TLS Core.
      - GPX_CONTROL_PLANE_CORE_ENDPOINT=http://goproxify-core:8000

      # ── Optionnel ──────────────────────────────────────────────────────────
      - GPX_ENGINE_LOG_LEVEL=${LOG_LEVEL:-info}
      # Nom du nœud affiché dans l'Admin (défaut : auto-généré)
      # - GPX_IDENTITY_AGENT_NODE_NAME=agent-1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - goproxify_agent_data:/etc/goproxify
    networks:
      - goproxify_net
    depends_on:
      goproxify-core:
        condition: service_started

  # ---------------------------------------------------------------------------
  # LANDING — Site vitrine (optionnel — décommenter si nécessaire)
  # ---------------------------------------------------------------------------
  # goproxify-landing:
  #   image: ${GOPROXIFY_REGISTRY:-ghcr.io/vincamok/goproxify}/landing:${GOPROXIFY_TAG:-latest}
  #   container_name: goproxify-landing
  #   restart: unless-stopped
  #   command: ["landing"]
  #   environment:
  #     - TZ=${TZ:-Europe/Paris}
  #     - GPX_SERVER_PORT=${LANDING_PORT:-3000}
  #     - GPX_SITE_DOMAIN=${LANDING_DOMAIN:-goproxify.dev}
  #   ports:
  #     - "${LANDING_PORT:-3000}:3000"
